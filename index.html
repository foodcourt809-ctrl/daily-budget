<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>하루가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFEAE0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #EFEAE0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #2B2A28;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { max-width: 420px; margin: 0 auto; padding: 24px 16px 40px; }

  .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .app-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .month-label { font-size: 13px; color: #7A7568; }

  .tab-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    height: 40px; border-radius: 10px; border: 1px solid #DCD4C2; background: #FBF9F5;
    font-size: 14px; font-weight: 600; color: #7A7568; cursor: pointer;
  }
  .tab-btn.active { background: #2B2A28; color: #FBF9F5; border-color: #2B2A28; }

  .hero-card { background: #FBF9F5; border: 1px solid #DCD4C2; border-radius: 18px; padding: 26px 22px; margin-bottom: 14px; }
  .hero-label { font-size: 13px; color: #7A7568; margin: 0 0 6px; }
  .hero-amount { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 40px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
  .hero-amount.over { color: #B23A2E; }
  .hero-amount.under { color: #2F6F4E; }
  .hero-sub { font-size: 13px; color: #7A7568; margin-top: 8px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-box { background: #FBF9F5; border: 1px solid #DCD4C2; border-radius: 14px; padding: 14px 16px; }
  .stat-box .label { font-size: 12px; color: #7A7568; margin: 0 0 4px; }
  .stat-box .value { font-size: 17px; font-weight: 600; margin: 0; }
  .stat-box .value.over { color: #B23A2E; }
  .stat-box .value.under { color: #2F6F4E; }

  .input-card { background: #FBF9F5; border: 1px solid #DCD4C2; border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  .input-card .heading { font-size: 14px; font-weight: 600; margin: 0 0 12px; }

  .amount-input, .text-input {
    width: 100%; height: 46px; font-size: 16px; font-weight: 600; padding: 0 14px;
    border-radius: 10px; border: 1px solid #CFC5AE; background: #fff; color: #2B2A28; margin-bottom: 10px;
  }
  .amount-input { font-size: 18px; }
  .amount-input:focus, .text-input:focus { outline: 2px solid #2F6F4E; border-color: #2F6F4E; }

  .date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .date-input {
    flex: 1; min-width: 0; height: 46px; font-size: 16px; font-weight: 600; padding: 0 14px;
    border-radius: 10px; border: 1px solid #CFC5AE; background: #fff; color: #2B2A28;
    font-family: inherit;
  }
  .date-input:focus { outline: 2px solid #2F6F4E; border-color: #2F6F4E; }
  .today-btn {
    height: 46px; padding: 0 16px; border-radius: 10px; border: 1px solid #CFC5AE;
    background: #fff; font-size: 14px; font-weight: 600; color: #4A473F; cursor: pointer;
  }
  .date-row.backdated .date-input { border-color: #C98A1B; background: #FFF8E6; }
  .backdate-hint { font-size: 12px; color: #9A6A12; margin: -4px 0 10px; display: none; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 44px; border-radius: 10px; border: 1px solid #CFC5AE; background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(0.98); }
  .btn-expense { color: #B23A2E; border-color: #E3B7AF; }
  .btn-income { color: #2F6F4E; border-color: #B7D4C2; }

  .error-msg { font-size: 13px; color: #B23A2E; margin: -4px 0 10px; display: none; }

  .cat-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .cat-pill {
    height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #CFC5AE;
    background: #fff; font-size: 13px; font-weight: 600; color: #4A473F; cursor: pointer;
    display: inline-flex; align-items: center;
  }
  .cat-pill::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c, #999); margin-right: 6px;
  }
  .cat-pill.active { background: var(--c, #2B2A28); border-color: var(--c, #2B2A28); color: #fff; }
  .cat-pill.active::before { background: #fff; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  .settings-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7A7568; margin-bottom: 18px; cursor: pointer; user-select: none; }
  .settings-row span.link { color: #2B2A28; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

  .settings-panel { background: #FBF9F5; border: 1px solid #DCD4C2; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; display: none; }
  .settings-panel.open { display: block; }
  .settings-panel .label { font-size: 12px; color: #7A7568; margin: 0 0 6px; }

  .section-title { font-size: 14px; font-weight: 600; margin: 20px 0 10px; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #DCD4C2; background: #FBF9F5; font-size: 16px; cursor: pointer; }
  .month-nav .label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 18px; }

  .cat-block { background: #FBF9F5; border: 1px solid #DCD4C2; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .cat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
  .cat-row .cat-name { color: #4A473F; }
  .cat-row .cat-amt { font-weight: 600; }

  .txn-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 4px; border-bottom: 1px solid #DCD4C2; }
  .txn-row:last-child { border-bottom: none; }
  .txn-date { font-size: 12px; color: #A39C89; width: 40px; flex-shrink: 0; }
  .txn-name { flex: 1; font-size: 14px; padding: 0 8px; }
  .txn-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .txn-del { font-size: 12px; color: #A39C89; margin-left: 8px; cursor: pointer; }

  .empty-state { font-size: 13px; color: #A39C89; padding: 14px 4px; text-align: center; }

  .day-list-title { font-size: 12px; color: #7A7568; margin: 14px 0 4px; }
  .today-txn-list { margin-top: 0; }
  .today-txn { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #EDE7D8; }
  .today-txn .t-name { flex: 1; color: #4A473F; }
  .today-txn .t-amt { font-weight: 600; }
  .today-txn .t-del { color: #A39C89; cursor: pointer; margin-left: 8px; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top-row">
    <div class="app-title">하루가계부</div>
    <div class="month-label" id="todayLabel"></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabToday">오늘</button>
    <button class="tab-btn" id="tabMonthly">월별 내역</button>
  </div>

  <div id="todayView">
    <div class="hero-card">
      <p class="hero-label" id="heroLabel">오늘 쓸 수 있는 돈</p>
      <p class="hero-amount" id="heroAmount">-</p>
      <p class="hero-sub" id="heroSub"></p>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><p class="label">이번 달 예산</p><p class="value" id="statBudget">-</p></div>
      <div class="stat-box"><p class="label">남은 잔액</p><p class="value" id="statRemain">-</p></div>
    </div>

    <div class="settings-row" id="settingsToggle">
      <span>월 예산 설정</span>
      <span class="link">수정</span>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <p class="label">이번 달 예산 (원)</p>
      <input type="number" class="amount-input" id="budgetInput" placeholder="500000">
      <p class="label">남은 잔액 직접 설정 (선택)</p>
      <input type="number" class="amount-input" id="remainInput" placeholder="예: 350000">
      <div class="btn-row">
        <button class="btn" id="budgetCancel">취소</button>
        <button class="btn btn-income" id="budgetSave">저장</button>
      </div>
    </div>

    <div class="input-card">
      <p class="heading">기록하기</p>
      <div class="date-row" id="dateRow">
        <input type="date" class="date-input" id="dateInput">
        <button class="today-btn" id="dateToday">오늘</button>
      </div>
      <p class="backdate-hint" id="backdateHint">이전 날짜에 기록하는 중이에요</p>
      <input type="number" class="amount-input" id="amountInput" placeholder="금액 입력">
      <div class="cat-picker" id="categoryPicker">
        <button class="cat-pill" data-cat="교통">교통</button>
        <button class="cat-pill" data-cat="식비">식비</button>
        <button class="cat-pill" data-cat="군것질">군것질</button>
        <button class="cat-pill" data-cat="취미">취미</button>
        <button class="cat-pill" data-cat="기타">기타</button>
      </div>
      <input type="text" class="text-input" id="customNameInput" placeholder="직접 입력" style="display:none;">
      <p class="error-msg" id="inputError">금액을 입력해 주세요</p>
      <div class="btn-row">
        <button class="btn btn-expense" id="addExpense">지출</button>
        <button class="btn btn-income" id="addIncome">수입</button>
      </div>
      <div class="day-list-title" id="dayListTitle">오늘 기록</div>
      <div class="today-txn-list" id="todayTxnList"></div>
    </div>
  </div>

  <div id="monthlyView" style="display:none;">
    <div class="month-nav">
      <button id="prevMonth">〈</button>
      <div class="label" id="monthNavLabel"></div>
      <button id="nextMonth">〉</button>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><p class="label">총 지출</p><p class="value over" id="monthExpenseTotal">-</p></div>
      <div class="stat-box"><p class="label">총 수입</p><p class="value under" id="monthIncomeTotal">-</p></div>
    </div>

    <div class="section-title">지출 항목별 합계</div>
    <div class="cat-block" id="expenseCatBlock"></div>

    <div class="section-title">수입 항목별 합계</div>
    <div class="cat-block" id="incomeCatBlock"></div>

    <div class="section-title">전체 내역</div>
    <div id="monthTxnList"></div>
  </div>
</div>

<script>
(function() {
  var DEFAULT_BUDGET = 500000;
  var CAT_COLORS = {
    '교통': '#3B6FB6',
    '식비': '#C46A12',
    '군것질': '#C2417E',
    '취미': '#7A55C2',
    '기타': '#6B6A63'
  };
  var INCOME_COLOR = '#2F6F4E';

  var state = null;
  var activeTab = 'today';
  var viewY, viewM;
  var selectedKey = null;
  var selectedCategory = null;

  async function readStore() { return localStorage.getItem('budget-state'); }
  async function writeStore(v) { localStorage.setItem('budget-state', v); }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function monthKey(y, m) { return y + '-' + pad(m); }
  function todayParts() {
    var now = new Date();
    return { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
  }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function won(n) { n = Math.round(n); return n.toLocaleString('ko-KR') + '원'; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function amtColor(type, name) {
    if (type === 'income') return INCOME_COLOR;
    return CAT_COLORS[name] || CAT_COLORS['기타'];
  }
  function dotHtml(type, name) {
    if (type === 'income') return '';
    return '<span class="dot" style="background:' + amtColor(type, name) + '"></span>';
  }

  function defaultState() {
    return { monthlyBudget: DEFAULT_BUDGET, entries: {}, monthOverrides: {} };
  }

  async function loadState() {
    try {
      var raw = await readStore();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') throw new Error('empty');
      if (!parsed.monthlyBudget) parsed.monthlyBudget = DEFAULT_BUDGET;
      if (!parsed.entries) parsed.entries = {};
      if (!parsed.monthOverrides) parsed.monthOverrides = {};
      delete parsed.pastUsedOverride;
      delete parsed.trackingStartDay;
      state = parsed;
    } catch (e) {
      state = defaultState();
    }
  }

  async function saveState() {
    try { await writeStore(JSON.stringify(state)); } catch (e) {}
  }

  function dayNetActual(dateStr) {
    var txns = state.entries[dateStr];
    if (!txns || !txns.length) return null;
    var net = 0;
    for (var i = 0; i < txns.length; i++) net += txns[i].type === 'expense' ? txns[i].amount : -txns[i].amount;
    return net;
  }
  function dayNet(dateStr) { var a = dayNetActual(dateStr); return a === null ? 0 : a; }

  function sumNets(y, m, fromDay, toDay) {
    var s = 0;
    for (var d = fromDay; d <= toDay; d++) s += dayNet(dateKey(y, m, d));
    return s;
  }

  // dayNum 이전(1일 ~ dayNum-1일)까지 쓴 것으로 치는 금액
  function usedBeforeDay(y, m, dayNum) {
    var ov = state.monthOverrides[monthKey(y, m)];
    if (typeof ov === 'number') return ov + sumNets(y, m, 1, dayNum - 1);
    var avg = state.monthlyBudget / daysInMonth(y, m);
    var s = 0;
    for (var d = 1; d < dayNum; d++) {
      var a = dayNetActual(dateKey(y, m, d));
      s += a === null ? avg : a;
    }
    return s;
  }

  function allowanceForDay(y, m, dayNum) {
    var dim = daysInMonth(y, m);
    return (state.monthlyBudget - usedBeforeDay(y, m, dayNum)) / (dim - dayNum + 1);
  }

  function totalUsedThroughDay(y, m, dayNum) {
    return usedBeforeDay(y, m, dayNum) + dayNet(dateKey(y, m, dayNum));
  }

  // 지금까지의 기록 기준으로, 내일 배정될 금액
  function tomorrowAllowance(y, m, d) {
    var dim = daysInMonth(y, m);
    if (d >= dim) {
      var ny = m === 12 ? y + 1 : y;
      var nm = m === 12 ? 1 : m + 1;
      return state.monthlyBudget / daysInMonth(ny, nm);
    }
    return (state.monthlyBudget - totalUsedThroughDay(y, m, d)) / (dim - d);
  }

  function currentSelectedKey() {
    var t = todayParts();
    var todayKey = dateKey(t.y, t.m, t.d);
    if (!selectedKey || !/^\d{4}-\d{2}-\d{2}$/.test(selectedKey) || selectedKey > todayKey) return todayKey;
    return selectedKey;
  }

  function getMonthEntries(y, m) {
    var prefix = y + '-' + pad(m) + '-';
    var result = [];
    Object.keys(state.entries).forEach(function(key) {
      if (key.indexOf(prefix) === 0) {
        var day = parseInt(key.slice(8, 10), 10);
        state.entries[key].forEach(function(t, idx) {
          result.push({ date: key, day: day, idx: idx, type: t.type, amount: t.amount, name: t.name || '' });
        });
      }
    });
    result.sort(function(a, b) { return b.date === a.date ? 0 : (a.date < b.date ? 1 : -1); });
    return result;
  }

  function categorySummary(monthEntries, type) {
    var map = {};
    monthEntries.forEach(function(e) {
      if (e.type !== type) return;
      var key = e.name || '기타';
      map[key] = (map[key] || 0) + e.amount;
    });
    return Object.keys(map).map(function(k) { return { name: k, total: map[k] }; }).sort(function(a, b) { return b.total - a.total; });
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('todayView').style.display = tab === 'today' ? '' : 'none';
    document.getElementById('monthlyView').style.display = tab === 'monthly' ? '' : 'none';
    document.getElementById('tabToday').classList.toggle('active', tab === 'today');
    document.getElementById('tabMonthly').classList.toggle('active', tab === 'monthly');
    render();
  }

  function renderToday() {
    var t = todayParts();
    var y = t.y, m = t.m, d = t.d;
    var todayKey = dateKey(y, m, d);

    document.getElementById('todayLabel').textContent = y + '년 ' + m + '월 ' + d + '일';

    var allowanceToday = allowanceForDay(y, m, d);
    var netToday = dayNet(todayKey);
    var leftToday = allowanceToday - netToday;
    var tomLabel = d >= daysInMonth(y, m) ? '내일(다음 달) 예상 ' : '내일 예상 ';
    var tomText = tomLabel + won(tomorrowAllowance(y, m, d));

    var heroAmount = document.getElementById('heroAmount');
    var heroSub = document.getElementById('heroSub');
    var heroLabel = document.getElementById('heroLabel');
    heroAmount.classList.remove('over', 'under');

    if (leftToday < 0) {
      heroLabel.textContent = '오늘 초과한 금액';
      heroAmount.textContent = won(Math.abs(leftToday));
      heroAmount.classList.add('over');
    } else {
      heroLabel.textContent = '오늘 쓸 수 있는 돈';
      heroAmount.textContent = won(leftToday);
      if (netToday !== 0) heroAmount.classList.add('under');
    }
    heroSub.textContent = '오늘 배정액 ' + won(allowanceToday) + ' · ' + tomText;

    var remainBalance = state.monthlyBudget - totalUsedThroughDay(y, m, d);
    document.getElementById('statBudget').textContent = won(state.monthlyBudget);
    var remainEl = document.getElementById('statRemain');
    remainEl.textContent = won(remainBalance);
    remainEl.classList.remove('over', 'under');
    remainEl.classList.add(remainBalance < 0 ? 'over' : 'under');

    document.getElementById('budgetInput').value = state.monthlyBudget;
    var remainInput = document.getElementById('remainInput');
    remainInput.value = Math.round(remainBalance);
    remainInput.dataset.orig = String(Math.round(remainBalance));

    // 날짜 선택 (이전 날짜 기록)
    var selKey = currentSelectedKey();
    var backdated = selKey !== todayKey;
    var dateInput = document.getElementById('dateInput');
    dateInput.max = todayKey;
    dateInput.value = selKey;
    document.getElementById('dateRow').classList.toggle('backdated', backdated);
    document.getElementById('backdateHint').style.display = backdated ? 'block' : 'none';
    var parts = selKey.split('-');
    document.getElementById('dayListTitle').textContent =
      backdated ? (parseInt(parts[1], 10) + '월 ' + parseInt(parts[2], 10) + '일 기록') : '오늘 기록';

    var dayTxns = state.entries[selKey] || [];
    var listEl = document.getElementById('todayTxnList');
    listEl.innerHTML = '';
    if (dayTxns.length === 0) {
      listEl.innerHTML = '<div class="empty-state">아직 기록이 없어요</div>';
      return;
    }
    for (var i = dayTxns.length - 1; i >= 0; i--) {
      (function(idx) {
        var txn = dayTxns[idx];
        var row = document.createElement('div');
        row.className = 'today-txn';
        var sign = txn.type === 'expense' ? '-' : '+';
        var label = txn.name ? esc(txn.name) : (txn.type === 'expense' ? '지출' : '수입');
        row.innerHTML = '<span class="t-name">' + dotHtml(txn.type, txn.name) + label + '</span>' +
          '<span><span class="t-amt" style="color:' + amtColor(txn.type, txn.name) + '">' + sign + won(txn.amount) + '</span>' +
          '<span class="t-del" data-idx="' + idx + '">삭제</span></span>';
        listEl.appendChild(row);
      })(i);
    }
    listEl.querySelectorAll('.t-del').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        dayTxns.splice(idx, 1);
        if (dayTxns.length === 0) delete state.entries[selKey];
        saveState();
        render();
      });
    });
  }

  function renderMonthly() {
    document.getElementById('monthNavLabel').textContent = viewY + '년 ' + viewM + '월';
    var entries = getMonthEntries(viewY, viewM);

    var expenseTotal = 0, incomeTotal = 0;
    entries.forEach(function(e) { if (e.type === 'expense') expenseTotal += e.amount; else incomeTotal += e.amount; });
    document.getElementById('monthExpenseTotal').textContent = won(expenseTotal);
    document.getElementById('monthIncomeTotal').textContent = won(incomeTotal);

    var expCats = categorySummary(entries, 'expense');
    var incCats = categorySummary(entries, 'income');

    document.getElementById('expenseCatBlock').innerHTML = expCats.length ? expCats.map(function(c) {
      return '<div class="cat-row"><span class="cat-name">' + dotHtml('expense', c.name) + esc(c.name) + '</span>' +
        '<span class="cat-amt" style="color:' + amtColor('expense', c.name) + '">' + won(c.total) + '</span></div>';
    }).join('') : '<div class="empty-state">지출 기록이 없어요</div>';

    document.getElementById('incomeCatBlock').innerHTML = incCats.length ? incCats.map(function(c) {
      return '<div class="cat-row"><span class="cat-name">' + esc(c.name) + '</span>' +
        '<span class="cat-amt" style="color:' + INCOME_COLOR + '">' + won(c.total) + '</span></div>';
    }).join('') : '<div class="empty-state">수입 기록이 없어요</div>';

    var listEl = document.getElementById('monthTxnList');
    listEl.innerHTML = '';
    if (entries.length === 0) {
      listEl.innerHTML = '<div class="empty-state">이 달의 기록이 없어요</div>';
      return;
    }
    entries.forEach(function(e) {
      var row = document.createElement('div');
      row.className = 'txn-row';
      var sign = e.type === 'expense' ? '-' : '+';
      var label = e.name ? esc(e.name) : (e.type === 'expense' ? '지출' : '수입');
      row.innerHTML =
        '<span class="txn-date">' + viewM + '/' + e.day + '</span>' +
        '<span class="txn-name">' + dotHtml(e.type, e.name) + label + '</span>' +
        '<span><span class="txn-amt" style="color:' + amtColor(e.type, e.name) + '">' + sign + won(e.amount) + '</span>' +
        '<span class="txn-del" data-date="' + e.date + '" data-idx="' + e.idx + '">삭제</span></span>';
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('.txn-del').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var dt = btn.getAttribute('data-date');
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        state.entries[dt].splice(idx, 1);
        if (state.entries[dt].length === 0) delete state.entries[dt];
        saveState();
        render();
      });
    });
  }

  function render() {
    if (activeTab === 'today') renderToday(); else renderMonthly();
  }

  function resetCategoryPicker() {
    selectedCategory = null;
    document.querySelectorAll('.cat-pill').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('customNameInput').style.display = 'none';
    document.getElementById('customNameInput').value = '';
  }

  function addTxn(type) {
    var input = document.getElementById('amountInput');
    var errorEl = document.getElementById('inputError');
    var val = parseFloat(input.value);
    if (!val || val <= 0) { errorEl.style.display = 'block'; return; }
    errorEl.style.display = 'none';
    var key = currentSelectedKey();
    var name = '';
    if (selectedCategory === '기타') {
      name = document.getElementById('customNameInput').value.trim();
    } else if (selectedCategory) {
      name = selectedCategory;
    }
    if (!state.entries[key]) state.entries[key] = [];
    state.entries[key].push({ type: type, amount: val, name: name });
    input.value = '';
    resetCategoryPicker();
    saveState();
    render();
  }

  document.getElementById('amountInput').addEventListener('input', function() {
    document.getElementById('inputError').style.display = 'none';
  });
  document.getElementById('addExpense').addEventListener('click', function() { addTxn('expense'); });
  document.getElementById('addIncome').addEventListener('click', function() { addTxn('income'); });

  document.getElementById('dateInput').addEventListener('change', function() {
    selectedKey = this.value || null;
    render();
  });
  document.getElementById('dateToday').addEventListener('click', function() {
    selectedKey = null;
    render();
  });

  document.getElementById('settingsToggle').addEventListener('click', function() {
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('budgetCancel').addEventListener('click', function() {
    document.getElementById('settingsPanel').classList.remove('open');
    render();
  });
  document.getElementById('budgetSave').addEventListener('click', function() {
    var v = parseFloat(document.getElementById('budgetInput').value);
    if (v && v > 0) state.monthlyBudget = v;
    var remainEl = document.getElementById('remainInput');
    var r = remainEl.value;
    if (r !== '' && r !== remainEl.dataset.orig && !isNaN(parseFloat(r))) {
      var t = todayParts();
      state.monthOverrides[monthKey(t.y, t.m)] = state.monthlyBudget - parseFloat(r) - sumNets(t.y, t.m, 1, t.d);
    }
    saveState();
    document.getElementById('settingsPanel').classList.remove('open');
    render();
  });

  document.getElementById('tabToday').addEventListener('click', function() { switchTab('today'); });
  document.getElementById('tabMonthly').addEventListener('click', function() { switchTab('monthly'); });
  document.getElementById('prevMonth').addEventListener('click', function() {
    viewM -= 1;
    if (viewM < 1) { viewM = 12; viewY -= 1; }
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    viewM += 1;
    if (viewM > 12) { viewM = 1; viewY += 1; }
    render();
  });

  document.querySelectorAll('.cat-pill').forEach(function(btn) {
    var cat = btn.getAttribute('data-cat');
    btn.style.setProperty('--c', CAT_COLORS[cat]);
    btn.addEventListener('click', function() {
      selectedCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('customNameInput').style.display = cat === '기타' ? '' : 'none';
      if (cat !== '기타') document.getElementById('customNameInput').value = '';
    });
  });

  var t0 = todayParts();
  viewY = t0.y; viewM = t0.m;

  loadState().then(render);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }
})();
</script>

</body>
</html>
